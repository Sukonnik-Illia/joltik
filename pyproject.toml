[tool.poetry]
name = "joltik"
version = "0.1.0"
description = "Selling ads adapters with boost"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
SQLAlchemy = "^2.0.29"
requests = "^2.31.0"
google-ads = "^24.0.0"
python-dotenv = "^1.0.1"
alembic = "^1.13.1"
pydantic = "^2.7.3"
pydantic-settings = "^2.3.2"
psycopg = "^3.1.19"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.3"
pytest = "^8.2.0"
flake8-ruff = "^0.3.0"
pre-commit = "^3.7.0"
Faker = "^24.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "COM819", # prohibited-trailing-comma
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D211", # one-blank-line-before-class
    "D212", # multi-line-summary-second-line
    "D400", # First line should end with a period
    "D401", # First line should be in imperative mood
    "D415", # First line should end with a period
    "ERA001", # Found commented-out code
    "FA100", # Add `from __future__ import annotations` to simplify `typing.Union`
    "FA102", # Add `from __future__ import annotations`
    "PTH123", # `open()` should be replaced by `Path.open()`
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
# Ignore F401,F403 (import violations) in all __init__.py files.
"__init__.py" = ["F403", "F401"]
