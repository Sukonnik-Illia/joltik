[tool.poetry]
name = "joltik"
version = "0.1.0"
description = "Selling ads adapters with boost"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
SQLAlchemy = "^2.0.29"
requests = "^2.31.0"
google-ads = "^24.0.0"
python-dotenv = "^1.0.1"
alembic = "^1.13.1"
pydantic = "^2.7.3"
pydantic-settings = "^2.3.2"
psycopg = "^3.1.19"
fastapi = "^0.111.0"
pytest = "^8.2.2"
npm = "^0.1.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.3"
flake8-ruff = "^0.3.0"
pre-commit = "^3.7.0"
Faker = "^24.14.0"
sqlalchemy-utils = "^0.41.2"
pytest-env = "^1.1.3"
pytest = "^8.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
extend-exclude = ["docs/*"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN101",  # Missing type annotation for `self` in method
    "C901",    # `update_deal` is too complex (12 > 10)
    "COM819",  # prohibited-trailing-comma
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D106",    # Missing docstring in public nested class
    "D107",    # Missing docstring in `__init__`
    "D211",    # one-blank-line-before-class
    "D212",    # multi-line-summary-second-line
    "D400",    # First line should end with a period
    "D401",    # First line should be in imperative mood
    "D415",    # First line should end with a period
    "ERA001",  # Found commented-out code
    "FA100",   # Add `from __future__ import annotations` to simplify `typing.Union`
    "FA102",   # Add `from __future__ import annotations`
    "ISC001",  # Implicitly concatenated string literals on one line
    "PLR0912", # Too many branches (13 > 12)
    "PTH123",  # `open()` should be replaced by `Path.open()`
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.ruff.format]
line-ending = "lf"


[tool.ruff.lint.per-file-ignores]
# Ignore F401,F403 (import violations) in all __init__.py files.
"__init__.py" = ["F403", "F401"]
"tests/*" = [
    "S101",
    "PLR0915", # Too many statements
    "N802",    # Function name `test_services_CRUD` should be lowercase
]


[tool.pytest_env]
ENVIRONMENT = "unittest"

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
